<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>魏敏軒分潤數據中心</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        klein: {
                            DEFAULT: '#002FA7',
                            light: '#335CFF',
                            dark: '#001D66',
                            glass: 'rgba(0, 47, 167, 0.1)'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap');
        body { font-family: 'Inter', -apple-system, sans-serif; }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .glass-panel {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.05);
        }

        .custom-dropdown-menu {
            opacity: 0;
            visibility: hidden;
            transform: translateY(-10px);
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .custom-dropdown-menu.active {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .fav-bubble {
            padding: 6px 16px;
            border-radius: 50px;
            background: rgba(0, 0, 0, 0.04);
            font-size: 13px;
            font-weight: 800;
            color: #6E6E73;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid transparent;
            white-space: nowrap;
        }
        .fav-bubble:hover { background: rgba(0, 47, 167, 0.1); color: #002FA7; }
        .fav-bubble.active {
            background: #002FA7;
            color: white;
            box-shadow: 0 4px 10px rgba(0, 47, 167, 0.3);
            transform: scale(1.05) translateY(-2px);
        }

        .loading-pulse { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }

        /* 登入遮罩 */
        #auth-overlay {
            position: fixed; inset: 0; z-index: 100;
            background: linear-gradient(135deg, #f0f4ff 0%, #ffffff 50%, #e6ecf8 100%);
            display: flex; align-items: center; justify-content: center;
            transition: opacity .35s ease, visibility .35s ease;
        }
        #auth-overlay.hidden-panel { opacity: 0; visibility: hidden; }
        #app-shell { opacity: 0; transition: opacity .4s ease; }
        #app-shell.ready { opacity: 1; }
    </style>
</head>
<body class="bg-gradient-to-br from-[#f0f4ff] via-[#ffffff] to-[#e6ecf8] min-h-screen text-gray-800 pb-12">

    <!-- ============ 登入遮罩 ============ -->
    <div id="auth-overlay">
        <div class="glass-panel rounded-3xl p-10 w-full max-w-sm mx-4">
            <div class="flex items-center gap-3 mb-1">
                <div class="w-3 h-8 bg-klein rounded-full"></div>
                <h1 class="text-xl font-black text-gray-900 tracking-wider">分潤數據中心</h1>
            </div>
            <p class="text-xs font-bold text-gray-400 mb-8 pl-6 tracking-widest uppercase">請以營收系統帳號登入</p>

            <div id="auth-checking" class="text-center py-8 text-sm font-bold text-gray-400 loading-pulse">
                正在確認登入狀態...
            </div>

            <div id="auth-form" class="hidden flex-col gap-3">
                <input id="auth-email" type="email" autocomplete="username" placeholder="Email"
                    class="bg-white/80 border-2 border-white rounded-xl px-4 py-3 font-bold text-gray-700 placeholder-gray-400 outline-none focus:border-klein/40 transition-all">
                <input id="auth-password" type="password" autocomplete="current-password" placeholder="密碼"
                    class="bg-white/80 border-2 border-white rounded-xl px-4 py-3 font-bold text-gray-700 placeholder-gray-400 outline-none focus:border-klein/40 transition-all">

                <button id="auth-submit"
                    class="bg-klein hover:bg-klein-dark text-white px-5 py-3 rounded-xl text-sm font-black transition-all shadow-lg shadow-klein/30 hover:scale-[1.02] mt-2">
                    登入
                </button>

                <div id="auth-error" class="hidden text-xs font-bold text-red-500 bg-red-50 border border-red-100 rounded-xl px-4 py-3 leading-relaxed"></div>
            </div>
        </div>
    </div>

    <!-- ============ 主畫面 ============ -->
    <div id="app-shell">
    <nav class="sticky top-0 z-50 px-4 py-4">
        <div class="max-w-6xl mx-auto glass-panel rounded-full px-6 py-3 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-3 h-8 bg-klein rounded-full"></div>
                <h1 class="text-xl font-black text-gray-900 tracking-wider">魏敏軒超級宇宙分潤數據大中心-穩定生活多美好三年五年高普考</h1>
            </div>
            <div class="flex items-center gap-4">
                <div id="last-update" class="hidden md:block text-xs font-semibold text-gray-500">連線中...</div>
                <button onclick="location.reload()" class="bg-klein hover:bg-klein-dark text-white px-5 py-2 rounded-full text-sm font-bold transition-all shadow-lg shadow-klein/30 hover:scale-105">
                    🔄 重新整理
                </button>
                <button id="btn-logout" class="text-gray-500 hover:text-red-500 px-3 py-2 rounded-full text-sm font-bold transition-all hover:bg-red-50">
                    登出
                </button>
            </div>
        </div>
    </nav>

    <div class="max-w-6xl mx-auto px-4 mt-8">

        <div class="glass-panel rounded-2xl p-4 mb-8 flex flex-wrap gap-4 items-center justify-between relative z-40">
            <div class="flex items-center gap-2 pl-2">
                <span class="text-sm font-black text-gray-400 tracking-widest uppercase">時間區間</span>
            </div>
            <div class="flex gap-3">
                <div class="relative" id="year-dropdown-container">
                    <button class="bg-white/70 border-2 border-white rounded-xl px-4 py-2 font-bold text-klein shadow-sm flex items-center justify-between w-36 hover:border-klein/30 transition-all" onclick="toggleDropdown('year-menu')">
                        <span id="year-btn-text">所有年度</span>
                        <svg class="w-4 h-4 ml-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M19 9l-7 7-7-7"></path></svg>
                    </button>
                    <div id="year-menu" class="custom-dropdown-menu absolute top-full left-0 mt-2 w-full glass-panel rounded-xl py-2 flex flex-col max-h-60 overflow-y-auto">
                        <div class="px-4 py-2 text-sm font-bold text-gray-600 hover:bg-klein/10 hover:text-klein cursor-pointer transition-colors" onclick="selectYear('all', '所有年度')">所有年度</div>
                        <div id="year-options"></div>
                    </div>
                </div>

                <div class="relative" id="month-dropdown-container">
                    <button class="bg-white/70 border-2 border-white rounded-xl px-4 py-2 font-bold text-klein shadow-sm flex items-center justify-between w-32 hover:border-klein/30 transition-all" onclick="toggleDropdown('month-menu')">
                        <span id="month-btn-text">全年度</span>
                        <svg class="w-4 h-4 ml-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M19 9l-7 7-7-7"></path></svg>
                    </button>
                    <div id="month-menu" class="custom-dropdown-menu absolute top-full left-0 mt-2 w-full glass-panel rounded-xl py-2 flex flex-col max-h-60 overflow-y-auto">
                        <div class="px-4 py-2 text-sm font-bold text-gray-600 hover:bg-klein/10 hover:text-klein cursor-pointer transition-colors" onclick="selectMonth('all', '全年度')">全年度</div>
                        <div id="month-options"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-8 relative z-10">
            <div class="lg:col-span-1 flex flex-col gap-6">
                <div class="glass-panel rounded-3xl p-8 relative overflow-hidden group">
                    <div class="absolute -right-10 -top-10 w-32 h-32 bg-klein opacity-5 rounded-full blur-2xl group-hover:scale-150 transition-transform duration-700"></div>
                    <h2 class="text-sm font-bold text-gray-500 mb-2 uppercase tracking-widest">已分潤累積收益</h2>
                    <div class="flex items-baseline gap-1">
                        <span class="text-xl font-black text-klein">NT$</span>
                        <p id="total-revenue" class="text-4xl font-black text-gray-900 tracking-tight">...</p>
                    </div>
                </div>
                <div class="glass-panel rounded-3xl p-8 relative overflow-hidden group">
                    <div class="absolute -right-10 -top-10 w-32 h-32 bg-orange-500 opacity-5 rounded-full blur-2xl group-hover:scale-150 transition-transform duration-700"></div>
                    <h2 class="text-sm font-bold text-gray-500 mb-2 uppercase tracking-widest">待結算收益</h2>
                    <div class="flex items-baseline gap-1">
                        <span class="text-xl font-black text-orange-500">NT$</span>
                        <p id="pending-revenue" class="text-4xl font-black text-gray-900 tracking-tight">...</p>
                    </div>
                </div>
                <div class="glass-panel rounded-3xl p-8 relative overflow-hidden group">
                    <div class="absolute -right-10 -top-10 w-32 h-32 bg-purple-500 opacity-5 rounded-full blur-2xl group-hover:scale-150 transition-transform duration-700"></div>
                    <h2 class="text-sm font-bold text-gray-500 mb-2 uppercase tracking-widest">當前區間總收益 (含待結算)</h2>
                    <div class="flex items-baseline gap-1">
                        <span class="text-xl font-black text-purple-500">NT$</span>
                        <p id="combined-revenue" class="text-4xl font-black text-gray-900 tracking-tight">...</p>
                    </div>
                </div>
            </div>

            <div class="lg:col-span-2 glass-panel rounded-3xl p-6 flex flex-col">
                <h3 class="text-base font-bold text-gray-700 mb-4 flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-klein"></span>
                    <span id="pie-chart-title">業主收入佔比分析</span>
                </h3>
                <div class="flex-1 relative min-h-[250px] w-full flex items-center justify-center">
                    <canvas id="revenuePieChart"></canvas>
                    <div id="chart-empty-state" class="absolute inset-0 flex items-center justify-center text-gray-400 font-bold hidden">
                        該區間尚無數據
                    </div>
                </div>
            </div>
        </div>

        <div class="flex flex-col lg:flex-row gap-4 mb-4 relative z-20">
            <div class="glass-panel rounded-2xl p-2 flex-1 lg:max-w-xs flex items-center px-4">
                <span class="text-gray-400 mr-2">🔍</span>
                <input type="text" id="searchInput" placeholder="搜尋業主名稱..." class="bg-transparent border-none outline-none w-full font-bold text-gray-700 placeholder-gray-400 py-2" oninput="renderView()">
            </div>

            <div class="glass-panel rounded-2xl p-3 flex-1 flex flex-wrap items-center gap-2">
                <span class="text-xs font-black text-gray-400 tracking-widest uppercase mr-2">⭐ 常用過濾 (可多選)</span>
                <div id="fav-clients-container" class="flex flex-wrap gap-2 items-center flex-1">
                </div>
                <div class="flex items-center gap-1 border-l border-gray-200 pl-3 ml-auto">
                    <button onclick="addFavClient()" class="text-klein font-black text-sm hover:bg-klein/10 px-3 py-1 rounded-full transition-colors">+ 新增</button>
                    <button onclick="removeFavClient()" class="text-red-500 font-black text-sm hover:bg-red-50 px-3 py-1 rounded-full transition-colors">- 刪除</button>
                </div>
            </div>
        </div>

        <div class="glass-panel rounded-3xl overflow-hidden relative z-10">
            <div class="px-8 py-5 border-b border-white/50 bg-white/30 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                <h3 class="font-bold text-gray-800 text-lg">收益明細列表</h3>
                <div class="flex gap-2">
                    <button id="btn-filter-pending" onclick="toggleStatusFilter('待結算')" class="px-4 py-1.5 rounded-full text-sm font-bold border-2 transition-all text-orange-500 border-orange-200 bg-white/50 hover:bg-orange-50">待結算</button>
                    <button id="btn-filter-settled" onclick="toggleStatusFilter('已分潤')" class="px-4 py-1.5 rounded-full text-sm font-bold border-2 transition-all text-green-600 border-green-200 bg-white/50 hover:bg-green-50">已分潤</button>
                </div>
            </div>

            <div class="overflow-x-auto no-scrollbar p-2">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="text-gray-400 text-xs tracking-wider uppercase border-b border-gray-100">
                            <th class="px-6 py-4 font-bold whitespace-nowrap">年月</th>
                            <th class="px-6 py-4 font-bold whitespace-nowrap">業主編號</th>
                            <th class="px-6 py-4 font-bold whitespace-nowrap">業主名稱</th>
                            <th class="px-6 py-4 font-bold whitespace-nowrap">案件名稱</th>
                            <th class="px-6 py-4 font-bold text-right whitespace-nowrap">比例</th>
                            <th class="px-6 py-4 font-bold text-right whitespace-nowrap">分潤金額</th>
                            <th class="px-6 py-4 font-bold text-center whitespace-nowrap">狀態</th>
                        </tr>
                    </thead>
                    <tbody id="revenue-table-body" class="divide-y divide-gray-100/50">
                        <tr>
                            <td colspan="7" class="px-6 py-12 text-center text-gray-400 font-bold loading-pulse">
                                正在安全地載入您的資料...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    </div><!-- /app-shell -->

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, doc, getDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import {
            getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut,
            setPersistence, browserLocalPersistence
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDllqltvIctsNWUuLW75kLUtcRnTjXdvBs",
            authDomain: "jaran-money.firebaseapp.com",
            projectId: "jaran-money",
            storageBucket: "jaran-money.firebasestorage.app",
            messagingSenderId: "616171972475",
            appId: "1:616171972475:web:980452f45898a03b4ebfde"
        };

        // ★ 如果你的營收表用的不是預設資料庫，把資料庫 ID 填在這裡，例如 "jaran-db"
        //   保持 null 代表使用 (default)
        const FIRESTORE_DATABASE_ID = null;

        // ★ 資料來源路徑：集合 / 文件
        const DATA_COLLECTION = 'system_data';
        const DATA_DOC = 'partner_view';

        const app = initializeApp(firebaseConfig);
        const db = FIRESTORE_DATABASE_ID ? getFirestore(app, FIRESTORE_DATABASE_ID) : getFirestore(app);
        const auth = getAuth(app);

        const tableBody = document.getElementById('revenue-table-body');
        const totalRevenueEl = document.getElementById('total-revenue');
        const pendingRevenueEl = document.getElementById('pending-revenue');
        const combinedRevenueEl = document.getElementById('combined-revenue');
        const lastUpdateEl = document.getElementById('last-update');
        const chartEmptyState = document.getElementById('chart-empty-state');
        const searchInput = document.getElementById('searchInput');
        const pieChartTitle = document.getElementById('pie-chart-title');

        const authOverlay = document.getElementById('auth-overlay');
        const authChecking = document.getElementById('auth-checking');
        const authForm = document.getElementById('auth-form');
        const authError = document.getElementById('auth-error');
        const emailInput = document.getElementById('auth-email');
        const passwordInput = document.getElementById('auth-password');
        const submitBtn = document.getElementById('auth-submit');
        const appShell = document.getElementById('app-shell');

        let allPartnerData = [];
        let pieChartInstance = null;
        let dataLoaded = false;

        window.selectedYear = 'all';
        window.selectedMonth = 'all';
        window.activeFavClients = new Set();
        window.statusFilter = 'all';

        // localStorage 在部分內嵌環境會拋錯，包起來避免整頁掛掉
        const safeStore = {
            get(key, fallback) {
                try {
                    const raw = localStorage.getItem(key);
                    return raw ? JSON.parse(raw) : fallback;
                } catch (e) { return fallback; }
            },
            set(key, value) {
                try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { /* 忽略 */ }
            }
        };
        window.favClients = safeStore.get('partner_fav_clients', ['小花', '醫敏家', '瑞瑞', '漢恩']);

        // 建立月份選單
        (function buildMonthOptions() {
            const box = document.getElementById('month-options');
            let html = '';
            for (let i = 1; i <= 12; i++) {
                const m = String(i).padStart(2, '0');
                html += `<div class="px-4 py-2 text-sm font-bold text-gray-600 hover:bg-klein/10 hover:text-klein cursor-pointer transition-colors" onclick="selectMonth('${m}', '${i}月')">${i}月</div>`;
            }
            box.innerHTML = html;
        })();

        const formatCurrency = (amount) =>
            new Intl.NumberFormat('zh-TW', { minimumFractionDigits: 0 }).format(amount);

        /* ==================== 登入流程 ==================== */

        const AUTH_MESSAGES = {
            'auth/invalid-email': 'Email 格式不正確。',
            'auth/user-not-found': '查無此帳號，確認一下是不是營收系統的同一組 Email。',
            'auth/wrong-password': '密碼錯誤。',
            'auth/invalid-credential': '帳號或密碼錯誤（新版 Firebase 不再區分兩者）。',
            'auth/too-many-requests': '嘗試次數過多，Firebase 暫時鎖住了，等幾分鐘再試。',
            'auth/network-request-failed': '連不到 Firebase，檢查網路或防火牆。',
            'auth/operation-not-allowed': 'Console 裡「Email/密碼」登入方式沒開啟。',
            'auth/unauthorized-domain': '這個網域沒被授權。到 Authentication → Settings → 已授權網域 加入目前的網域。'
        };

        function showAuthError(code, rawMessage) {
            authError.classList.remove('hidden');
            const friendly = AUTH_MESSAGES[code] || rawMessage || '未知錯誤';
            authError.innerHTML = `${friendly}<br><span class="text-gray-400 font-mono text-[10px]">${code || '-'}</span>`;
        }

        async function doLogin() {
            const email = emailInput.value.trim();
            const password = passwordInput.value;
            if (!email || !password) {
                showAuthError(null, '請輸入 Email 與密碼。');
                return;
            }
            authError.classList.add('hidden');
            submitBtn.disabled = true;
            submitBtn.innerText = '登入中...';
            try {
                await setPersistence(auth, browserLocalPersistence);
                await signInWithEmailAndPassword(auth, email, password);
                // 成功後由 onAuthStateChanged 接手
            } catch (err) {
                console.error('登入失敗：', err);
                showAuthError(err.code, err.message);
                submitBtn.disabled = false;
                submitBtn.innerText = '登入';
            }
        }

        submitBtn.addEventListener('click', doLogin);
        [emailInput, passwordInput].forEach(el => {
            el.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
        });

        document.getElementById('btn-logout').addEventListener('click', async () => {
            await signOut(auth);
            location.reload();
        });

        onAuthStateChanged(auth, (user) => {
            if (user) {
                authOverlay.classList.add('hidden-panel');
                appShell.classList.add('ready');
                if (!dataLoaded) {
                    dataLoaded = true;
                    loadPartnerData();
                }
            } else {
                authOverlay.classList.remove('hidden-panel');
                appShell.classList.remove('ready');
                authChecking.classList.add('hidden');
                authForm.classList.remove('hidden');
                authForm.classList.add('flex');
                submitBtn.disabled = false;
                submitBtn.innerText = '登入';
            }
        });

        /* ==================== UI 控制 ==================== */

        window.toggleStatusFilter = function(status) {
            window.statusFilter = (window.statusFilter === status) ? 'all' : status;
            updateStatusButtonsUI();
            renderView();
        };

        window.updateStatusButtonsUI = function() {
            const btnPending = document.getElementById('btn-filter-pending');
            const btnSettled = document.getElementById('btn-filter-settled');

            btnPending.className = "px-4 py-1.5 rounded-full text-sm font-bold border-2 transition-all text-orange-500 border-orange-200 bg-white/50 hover:bg-orange-50";
            btnSettled.className = "px-4 py-1.5 rounded-full text-sm font-bold border-2 transition-all text-green-600 border-green-200 bg-white/50 hover:bg-green-50";

            if (window.statusFilter === '待結算') {
                btnPending.className = "px-4 py-1.5 rounded-full text-sm font-black border-2 transition-all bg-orange-100 text-orange-700 border-orange-400 shadow-sm transform scale-105";
            } else if (window.statusFilter === '已分潤') {
                btnSettled.className = "px-4 py-1.5 rounded-full text-sm font-black border-2 transition-all bg-green-100 text-green-700 border-green-400 shadow-sm transform scale-105";
            }
        };

        window.toggleDropdown = function(menuId) {
            document.querySelectorAll('.custom-dropdown-menu').forEach(menu => {
                if (menu.id !== menuId) menu.classList.remove('active');
            });
            document.getElementById(menuId).classList.toggle('active');
        };

        window.selectYear = function(val, text) {
            window.selectedYear = val;
            document.getElementById('year-btn-text').innerText = text;
            document.getElementById('year-menu').classList.remove('active');
            renderView();
        };

        window.selectMonth = function(val, text) {
            window.selectedMonth = val;
            document.getElementById('month-btn-text').innerText = text;
            document.getElementById('month-menu').classList.remove('active');
            renderView();
        };

        document.addEventListener('click', (e) => {
            if (!e.target.closest('#year-dropdown-container')) document.getElementById('year-menu').classList.remove('active');
            if (!e.target.closest('#month-dropdown-container')) document.getElementById('month-menu').classList.remove('active');
        });

        window.renderFavClients = function() {
            const container = document.getElementById('fav-clients-container');
            container.innerHTML = '';
            if (window.favClients.length === 0) {
                container.innerHTML = '<span class="text-gray-400 text-xs font-bold">尚無常用設定</span>';
                return;
            }
            window.favClients.forEach(c => {
                const isActive = window.activeFavClients.has(c) ? 'active' : '';
                container.innerHTML += `<div class="fav-bubble ${isActive}" onclick="toggleFavClient('${c}')">${c}</div>`;
            });
        };

        window.toggleFavClient = function(clientName) {
            if (window.activeFavClients.has(clientName)) {
                window.activeFavClients.delete(clientName);
            } else {
                window.activeFavClients.add(clientName);
            }
            renderFavClients();
            renderView();
        };

        window.addFavClient = function() {
            let name = prompt("請輸入要新增的常用業主名稱：");
            if (name && name.trim()) {
                name = name.trim();
                if (!window.favClients.includes(name)) {
                    window.favClients.push(name);
                    safeStore.set('partner_fav_clients', window.favClients);
                    renderFavClients();
                }
            }
        };

        window.removeFavClient = function() {
            let name = prompt("請輸入要刪除的常用業主名稱：");
            if (name && window.favClients.includes(name)) {
                window.favClients = window.favClients.filter(c => c !== name);
                safeStore.set('partner_fav_clients', window.favClients);
                window.activeFavClients.delete(name);
                renderView();
                renderFavClients();
            } else if (name) {
                alert("找不到該業主名稱！");
            }
        };

        /* ==================== 圖表 ==================== */

        function updatePieChart(filteredData) {
            const ctx = document.getElementById('revenuePieChart').getContext('2d');
            if (pieChartInstance) pieChartInstance.destroy();

            const isAggregatedView = (window.selectedMonth === 'all');

            pieChartTitle.innerText = isAggregatedView
                ? '業主總收入佔比 (年度聚合，顯示總金額)'
                : '業主收入佔比 (各月追蹤，區分已分潤/待結算)';

            let clientStats = {};
            filteredData.forEach(d => {
                let name = d.clientName || '未知業主';
                if (!clientStats[name]) clientStats[name] = { total: 0, settled: 0, pending: 0 };
                const amt = d.amount || 0;
                clientStats[name].total += amt;
                if (d.status === '已分潤') clientStats[name].settled += amt;
                else clientStats[name].pending += amt;
            });

            const labels = [];
            const dataValues = [];
            const bgColors = [];

            const colorPalette = [
                { base: '#002FA7', light: 'rgba(0, 47, 167, 0.35)' },
                { base: '#00D26A', light: 'rgba(0, 210, 106, 0.35)' },
                { base: '#FF9500', light: 'rgba(255, 149, 0, 0.35)' },
                { base: '#7c3aed', light: 'rgba(124, 58, 237, 0.35)' },
                { base: '#FF3B30', light: 'rgba(255, 59, 48, 0.35)' },
                { base: '#5AC8FA', light: 'rgba(90, 200, 250, 0.35)' },
                { base: '#FF2D55', light: 'rgba(255, 45, 85, 0.35)' },
                { base: '#001D66', light: 'rgba(0, 29, 102, 0.35)' }
            ];

            let colorIndex = 0;

            Object.keys(clientStats).forEach(clientName => {
                const stats = clientStats[clientName];
                const colors = colorPalette[colorIndex % colorPalette.length];

                if (isAggregatedView) {
                    if (stats.total > 0) {
                        labels.push(clientName);
                        dataValues.push(stats.total);
                        bgColors.push(colors.base);
                    }
                } else {
                    if (stats.settled > 0) {
                        labels.push(`${clientName} (已分潤)`);
                        dataValues.push(stats.settled);
                        bgColors.push(colors.base);
                    }
                    if (stats.pending > 0) {
                        labels.push(`${clientName} (待結算)`);
                        dataValues.push(stats.pending);
                        bgColors.push(colors.light);
                    }
                }
                colorIndex++;
            });

            if (labels.length === 0) {
                document.getElementById('revenuePieChart').style.display = 'none';
                chartEmptyState.classList.remove('hidden');
                return;
            } else {
                document.getElementById('revenuePieChart').style.display = 'block';
                chartEmptyState.classList.add('hidden');
            }

            pieChartInstance = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: labels,
                    datasets: [{
                        data: dataValues,
                        backgroundColor: bgColors,
                        borderWidth: 2,
                        borderColor: '#ffffff',
                        hoverOffset: 12
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    cutout: '60%',
                    plugins: {
                        legend: {
                            position: 'right',
                            labels: { usePointStyle: true, padding: 12, font: { family: 'Inter', weight: 'bold', size: 12 } },
                            onHover: function(e, legendItem, legend) {
                                const chart = legend.chart;
                                chart.setActiveElements([{ datasetIndex: 0, index: legendItem.index }]);
                                chart.tooltip.setActiveElements([{ datasetIndex: 0, index: legendItem.index }], { x: 0, y: 0 });
                                chart.update();
                            },
                            onLeave: function(e, legendItem, legend) {
                                const chart = legend.chart;
                                chart.setActiveElements([]);
                                chart.tooltip.setActiveElements([]);
                                chart.update();
                            }
                        },
                        tooltip: {
                            backgroundColor: 'rgba(255, 255, 255, 0.95)',
                            titleColor: '#002FA7',
                            bodyColor: '#1D1D1F',
                            borderColor: 'rgba(0, 47, 167, 0.1)',
                            borderWidth: 1,
                            padding: 12,
                            callbacks: { label: (context) => ' NT$ ' + context.raw.toLocaleString() }
                        }
                    }
                }
            });
        }

        /* ==================== 資料渲染 ==================== */

        window.renderView = function() {
            const searchKeyword = searchInput.value.trim().toLowerCase();

            let filteredData = allPartnerData.filter(d => {
                const parts = (d.date || '').split('-');
                const rYear = parts[0];
                const rMonth = parts.length > 1 ? parts[1].padStart(2, '0') : null;

                const matchYear = (window.selectedYear === 'all') || (rYear === window.selectedYear);
                const matchMonth = (window.selectedMonth === 'all') || (rMonth === window.selectedMonth);
                const matchSearch = searchKeyword === '' || (d.clientName && d.clientName.toLowerCase().includes(searchKeyword));
                const matchFav = window.activeFavClients.size === 0 || window.activeFavClients.has(d.clientName);
                const matchStatus = window.statusFilter === 'all' || d.status === window.statusFilter;

                return matchYear && matchMonth && matchSearch && matchFav && matchStatus;
            });

            filteredData.sort((a, b) => {
                const idA = (a.clientNumber || '').toString().toLowerCase();
                const idB = (b.clientNumber || '').toString().toLowerCase();
                if (idA < idB) return -1;
                if (idA > idB) return 1;
                return (b.date || '').localeCompare(a.date || '');
            });

            let htmlContent = '';
            let totalAccumulated = 0;
            let totalPending = 0;
            let combinedAccumulated = 0;

            if (filteredData.length === 0) {
                tableBody.innerHTML = '<tr><td colspan="7" class="px-6 py-12 text-center text-gray-500 font-bold">此區間/條件下尚無分潤紀錄。</td></tr>';
                totalRevenueEl.textContent = '0';
                pendingRevenueEl.textContent = '0';
                combinedRevenueEl.textContent = '0';
                updatePieChart([]);
                return;
            }

            filteredData.forEach((data) => {
                const amount = data.amount || 0;
                combinedAccumulated += amount;
                if (data.status === '已分潤') totalAccumulated += amount; else totalPending += amount;

                const statusHtml = data.status === '已分潤'
                    ? `<span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-black bg-green-100 text-green-700 border border-green-200 shadow-sm">已分潤</span>`
                    : `<span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-black bg-orange-100 text-orange-700 border border-orange-200 shadow-sm">待結算</span>`;

                htmlContent += `
                    <tr class="hover:bg-klein-glass transition-colors group">
                        <td class="px-6 py-4 text-sm whitespace-nowrap text-gray-500 font-bold">${data.date || '-'}</td>
                        <td class="px-6 py-4 text-sm whitespace-nowrap font-black text-gray-400 bg-white/20">${data.clientNumber || '-'}</td>
                        <td class="px-6 py-4 text-sm whitespace-nowrap text-klein font-black bg-white/20">${data.clientName || '-'}</td>
                        <td class="px-6 py-4 text-sm text-gray-900 font-black">${data.projectName || '-'}</td>
                        <td class="px-6 py-4 text-sm text-right text-klein font-bold bg-white/30">${data.percent || 0}%</td>
                        <td class="px-6 py-4 text-sm text-right font-black text-gray-900 group-hover:text-klein transition-colors bg-white/30">${formatCurrency(amount)}</td>
                        <td class="px-6 py-4 text-center">${statusHtml}</td>
                    </tr>
                `;
            });

            tableBody.innerHTML = htmlContent;

            totalRevenueEl.textContent = formatCurrency(totalAccumulated);
            pendingRevenueEl.textContent = formatCurrency(totalPending);
            combinedRevenueEl.textContent = formatCurrency(combinedAccumulated);

            updatePieChart(filteredData);
        };

        /* ==================== 讀取 Firestore ==================== */

        // 容錯解析：字串就 parse，已經是陣列/物件就直接用
        function normalizeData(raw) {
            if (raw == null) return [];
            if (Array.isArray(raw)) return raw;
            if (typeof raw === 'string') {
                try {
                    const parsed = JSON.parse(raw);
                    return Array.isArray(parsed) ? parsed : Object.values(parsed);
                } catch (e) {
                    console.error('data 欄位不是合法 JSON：', e);
                    return [];
                }
            }
            if (typeof raw === 'object') return Object.values(raw);
            return [];
        }

        function showTableError(title, detail) {
            tableBody.innerHTML = `
                <tr><td colspan="7" class="px-6 py-12 text-center">
                    <div class="text-red-500 font-black mb-2">${title}</div>
                    <div class="text-gray-500 text-xs font-mono leading-relaxed">${detail}</div>
                </td></tr>`;
        }

        async function loadPartnerData() {
            try {
                const docRef = doc(db, DATA_COLLECTION, DATA_DOC);
                const docSnap = await getDoc(docRef);

                if (!docSnap.exists()) {
                    // 找不到文件時，列出這個集合實際有哪些文件，方便對照路徑
                    let hint = '';
                    try {
                        const snap = await getDocs(collection(db, DATA_COLLECTION));
                        const ids = snap.docs.map(d => d.id);
                        hint = ids.length
                            ? `「${DATA_COLLECTION}」集合底下目前有：${ids.join('、')}`
                            : `「${DATA_COLLECTION}」集合是空的。`;
                    } catch (e) {
                        hint = `無法列出集合內容（${e.code || e.message}）。`;
                    }
                    showTableError(
                        `找不到文件 ${DATA_COLLECTION}/${DATA_DOC}`,
                        hint + '<br>請對照營收表同步端實際寫入的路徑，修改程式最上方的 DATA_COLLECTION / DATA_DOC。'
                    );
                    lastUpdateEl.innerText = "查無資料";
                    return;
                }

                const dataObj = docSnap.data();
                allPartnerData = normalizeData(dataObj.data);

                if (allPartnerData.length === 0) {
                    showTableError(
                        '文件讀到了，但解析不出資料列',
                        `文件現有欄位：${Object.keys(dataObj).join('、')}<br>請確認同步端是把陣列存在哪個欄位。`
                    );
                    return;
                }

                if (dataObj.lastUpdate) {
                    const updateDate = new Date(dataObj.lastUpdate);
                    lastUpdateEl.innerText = `最後更新：${updateDate.toLocaleDateString()} ${updateDate.toLocaleTimeString()}`;
                    lastUpdateEl.classList.add('text-klein');
                }

                let years = new Set();
                allPartnerData.forEach(d => {
                    if (d.date && d.date !== '未定') years.add(d.date.split('-')[0]);
                });

                const yearOptionsContainer = document.getElementById('year-options');
                yearOptionsContainer.innerHTML = '';
                Array.from(years).sort().reverse().forEach(y => {
                    yearOptionsContainer.innerHTML += `<div class="px-4 py-2 text-sm font-bold text-gray-600 hover:bg-klein/10 hover:text-klein cursor-pointer transition-colors" onclick="selectYear('${y}', '${y} 年')">${y} 年</div>`;
                });

                renderFavClients();

                if (years.size > 0) {
                    const latestYear = Array.from(years).sort().reverse()[0];
                    selectYear(latestYear, `${latestYear} 年`);
                } else {
                    renderView();
                }

            } catch (error) {
                console.error("讀取資料失敗：", error);
                let title = '資料讀取失敗';
                let detail = `${error.code || ''} ${error.message || ''}`;

                if (error.code === 'permission-denied') {
                    title = '權限不足 (permission-denied)';
                    detail = `目前登入身分：${auth.currentUser ? auth.currentUser.email : '未登入'}<br>` +
                             `Firestore 安全規則沒有允許這個帳號讀取 ${DATA_COLLECTION}/${DATA_DOC}。`;
                } else if (error.code === 'unavailable') {
                    title = '連不到 Firestore (unavailable)';
                    detail = '可能是網路問題，或資料庫 ID 不對（檢查 FIRESTORE_DATABASE_ID）。';
                } else if (error.code === 'not-found') {
                    title = '資料庫不存在 (not-found)';
                    detail = '這個專案可能沒有 (default) 資料庫，請在 FIRESTORE_DATABASE_ID 填入正確的資料庫 ID。';
                }
                showTableError(title, detail);
                lastUpdateEl.innerText = "連線失敗";
            }
        }
    </script>
</body>
</html>
